url: https://www.levivoelz.com
description: Levi Voelz builds software, things, and experiences in Sonoma County, CA.
default_image: /images/levi_voelz-2026.jpg
highlighter: rouge
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
collections:
  projects:
    output: true
    permalink: /:collection/:name
  stories:
    output: true
    permalink: /:collection/:name
  posts:
    output: true
    permalink: /:collection/:year/:month/:day/:title
defaults:
  -
    scope:
      path: "slides/*"
    values:
      sitemap: false
